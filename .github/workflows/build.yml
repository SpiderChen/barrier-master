name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        shell: bash
        run: bash .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "build-deps\vcpkg"
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }

          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          & $vcpkg install openssl:x64-windows --clean-after-build

          $opensslRoot = Join-Path $vcpkgRoot "installed\x64-windows"
          if (-not (Test-Path (Join-Path $opensslRoot "include\openssl\ssl.h"))) {
            throw "vcpkg openssl did not provide include\openssl\ssl.h"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT=$opensslRoot"

      - name: Configure build environment
        shell: pwsh
        run: |
          $opensslRoot = @(
            "${env:OPENSSL_ROOT}",
            "${env:ProgramFiles}\OpenSSL-Win64",
            "${env:ProgramFiles}\OpenSSL",
            "${env:ProgramFiles(x86)}\OpenSSL-Win32"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ "include\openssl\ssl.h")) } | Select-Object -First 1

          if (-not $opensslRoot) {
            throw "OpenSSL installation was not found."
          }

          @"
          set B_BUILD_TYPE=$env:BUILD_TYPE
          set B_COPY_RUNTIME_DEPS=0
          set OPENSSL_ROOT=$opensslRoot
          set B_CMAKE_FLAGS=-DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          "@ | Set-Content -Encoding ASCII build_env.bat

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          clean_build.bat

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: barrier-windows-x64-cli
          path: build/bin/Release

  macos:
    name: macOS Intel CLI
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: bash .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config openssl@3

      - name: Build CLI binaries
        env:
          B_BUILD_TYPE: Release
          BARRIER_BUILD_ENV: "1"
          B_CMAKE_FLAGS: -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
        run: sh -x ./clean_build.sh

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: barrier-macos-intel-cli
          path: build/bin

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: bash .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavahi-compat-libdnssd-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev

      - name: Build
        env:
          B_BUILD_TYPE: Release
          B_CMAKE_FLAGS: -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
        run: sh -x ./clean_build.sh

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v7
        with:
          name: barrier-linux-x64-cli
          path: build/bin
