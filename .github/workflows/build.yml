name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: 5.15.2

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        shell: bash
        run: .github/scripts/ensure-submodules.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2019_64 --outputdir "$env:GITHUB_WORKSPACE\deps\Qt"

      - name: Install Bonjour SDK-like dependency
        shell: pwsh
        run: azure-pipelines/download_install_bonjour_sdk_like.ps1

      - name: Configure build environment
        shell: pwsh
        run: |
          @"
          set B_BUILD_TYPE=$env:BUILD_TYPE
          set B_QT_ROOT=%cd%\deps\Qt
          set B_QT_VER=$env:QT_VERSION
          set B_QT_MSVC=msvc2019_64
          set B_BONJOUR=%cd%\deps\BonjourSDKLike
          set B_CMAKE_FLAGS=-DBARRIER_BUILD_TESTS=OFF
          "@ | Set-Content -Encoding ASCII build_env.bat

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          clean_build.bat

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: barrier-windows-x64
          path: build/bin/Release

  macos:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: .github/scripts/ensure-submodules.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          brew update
          brew install pkg-config openssl@3
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall
          python3 -m aqt install-qt mac desktop "$QT_VERSION" clang_64 --outputdir "$RUNNER_TEMP/Qt"

      - name: Build app bundle and dmg
        env:
          B_BUILD_TYPE: Release
          BARRIER_BUILD_ENV: "1"
          MACDEPLOYQT: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/clang_64/bin/macdeployqt
          B_CMAKE_FLAGS: >-
            -DCMAKE_PREFIX_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/clang_64
            -DBARRIER_BUILD_TESTS=OFF
        run: sh -x ./clean_build.sh

      - name: Upload macOS bundle and dmg
        uses: actions/upload-artifact@v4
        with:
          name: barrier-macos-intel
          path: |
            build/bin
            build/bundle

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavahi-compat-libdnssd-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools

      - name: Build
        env:
          B_BUILD_TYPE: Release
          B_CMAKE_FLAGS: -DBARRIER_BUILD_TESTS=OFF -DBARRIER_BUILD_INSTALLER=OFF
        run: sh -x ./clean_build.sh

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: barrier-linux-x64
          path: build/bin
