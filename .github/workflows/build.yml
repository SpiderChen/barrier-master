name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        shell: bash
        run: bash .github/scripts/ensure-submodules.sh

      - name: Configure build environment
        shell: pwsh
        run: |
          @"
          set B_BUILD_TYPE=$env:BUILD_TYPE
          set B_COPY_RUNTIME_DEPS=0
          set B_CMAKE_FLAGS=-DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
          "@ | Set-Content -Encoding ASCII build_env.bat

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          clean_build.bat

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: barrier-windows-x64-cli
          path: build/bin/Release

  macos:
    name: macOS Intel CLI
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: bash .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        run: |
          brew update
          brew install pkg-config openssl@3

      - name: Build CLI binaries
        env:
          B_BUILD_TYPE: Release
          BARRIER_BUILD_ENV: "1"
          B_CMAKE_FLAGS: -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
        run: sh -x ./clean_build.sh

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: barrier-macos-intel-cli
          path: build/bin

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure source dependencies
        run: bash .github/scripts/ensure-submodules.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavahi-compat-libdnssd-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev

      - name: Build
        env:
          B_BUILD_TYPE: Release
          B_CMAKE_FLAGS: -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=OFF
        run: sh -x ./clean_build.sh

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: barrier-linux-x64-cli
          path: build/bin
